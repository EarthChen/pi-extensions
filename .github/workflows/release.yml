name: publish

# Publish every extension to npm when a version tag is pushed.
# Trigger: `git push origin vX.Y.Z` (tag must be `v*` and sit on main).
on:
  push:
    tags:
      - "v*"

# Least privilege: trusted publishing uses OIDC (id-token), no npm token needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can resolve origin/main for the branch guard.
          fetch-depth: 0

      # A git tag is not bound to a branch. Enforce "tag is on main" by
      # checking the tagged commit is an ancestor of origin/main.
      - name: Ensure tag is on main
        run: |
          git fetch origin main
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT"; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on origin/main. Aborting publish."
            exit 1
          fi

      # Tag must match the single source of truth (root package.json version),
      # otherwise we would publish the wrong version.
      - name: Verify tag matches root version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (v$VERSION) does not match root package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Lockfile does not record workspace package versions, so version bumps
      # never invalidate it — frozen-lockfile is safe here.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Sync root version into every packages/*/package.json. When the tag
      # already carries the synced version this is a no-op (tree stays clean).
      - name: Sync version
        run: node scripts/sync-version.mjs

      # Trusted publishing: npm auto-uses the OIDC token from the
      # id-token: write permission. No NODE_AUTH_TOKEN required.
      - name: Publish to npm (trusted publisher)
        run: |
          echo "node=$(node -v) npm=$(npm -v)"
          echo "OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "OIDC_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          unset NODE_AUTH_TOKEN
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --provenance
        working-directory: packages/proactive-compact
